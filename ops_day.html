<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营数据单日详情</title>
<style>
/* ============================================================
   每日工作看板 — 设计系统 v2.1  (结构级重设计)
   靛蓝侧边栏 + 面包屑顶栏 + 统计条 + 趋势图 + 精致卡片
   ============================================================ */
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    /* 色彩 */
    --bg:#eaeef5;
    --bg-2:#f3f6fb;
    --surface:#ffffff;
    --surface-2:#f7f9fc;
    --surface-3:#eef2f8;
    --ink:#0f1729;
    --ink-2:#334155;
    --ink-3:#64748b;
    --ink-4:#94a3b8;
    --line:#e6eaf2;
    --line-2:#eef2f7;
    /* 品牌靛蓝 */
    --primary:#3b5bdb;
    --primary-600:#2f4ac0;
    --primary-700:#2740a8;
    --primary-bg:#eef1fe;
    --primary-bg-2:#e3e9fd;
    --green:#16a34a;   --green-bg:#ecfdf3;
    --red:#e5484d;     --red-bg:#fef3f2;
    --amber:#f59e0b;   --amber-bg:#fff7ed;
    --violet:#7c3aed;  --violet-bg:#f5f3ff;
    --cyan:#0ea5b7;
    /* 圆角 / 阴影 */
    --r-lg:18px; --r-md:14px; --r-sm:10px;
    --sh-sm:0 1px 2px rgba(16,24,40,.05), 0 2px 6px rgba(16,24,40,.05);
    --sh-md:0 8px 24px rgba(16,24,40,.08), 0 2px 6px rgba(16,24,40,.05);
    --sh-lg:0 18px 50px rgba(16,24,40,.18);
    --shadow-focus:0 0 0 4px rgba(59,91,219,.16);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  html,body{ height:100%; }
  body{
    font-family:var(--font);
    background:#f5f7fb;
    color:var(--ink);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }

  /* ===== 左侧菜单（靛蓝渐变 + 图标） ===== */
  .sidebar{
    width:100%; flex-shrink:0; display:flex; flex-direction:row; align-items:center; gap:18px;
    background:linear-gradient(90deg,#1e3a8a 0%,#1d4ed8 100%); color:#fff; box-shadow:0 2px 12px rgba(30,58,138,.28);
    border-bottom:none; position:relative; z-index:6; padding:0 18px; height:56px;
  }
  .sidebar::after{ display:none; }
  .sidebar .brand{ padding:0; display:flex; align-items:center; gap:10px; flex-shrink:0; border-bottom:none; }
  .sidebar .brand .logo{ width:38px; height:38px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(135deg,#60a5fa,#a78bfa); display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(96,165,250,.45); }
  .sidebar .brand .logo svg{ width:21px; height:21px; }
  .sidebar .brand .t{ display:flex; flex-direction:column; line-height:1.25; }
  .sidebar .brand .t b{ font-size:15px; font-weight:700; color:#fff; letter-spacing:.4px; }
  .sidebar .brand .s{ font-size:11px; font-weight:400; color:rgba(255,255,255,.72); margin-top:3px; letter-spacing:.3px; }
  .nav{ padding:0; display:flex; flex-direction:row; align-items:center; gap:6px; flex:1; overflow-x:auto; }
  .nav a{ display:flex; align-items:center; gap:7px; height:56px; padding:0 12px; border-radius:0; border-bottom:2px solid transparent; color:rgba(255,255,255,.82);
    text-decoration:none; font-size:13.5px; font-weight:500; cursor:pointer; transition:.15s; }
  .nav a .ico{ width:17px; height:17px; flex-shrink:0; color:rgba(255,255,255,.7); transition:.15s; }
  .nav a:hover{ background:rgba(255,255,255,.14); color:#fff; }
  .nav a:hover .ico{ color:#fff; }
  .nav a.active{ background:transparent; color:#fff; border-bottom-color:#fff; box-shadow:none; }
  .nav a.active::before{ display:none; }
  .nav a.active .ico{ color:#fff; }
  .sidebar .foot{ display:none; }
  /* 菜单分组 + 进度徽标 */
  .nav-group{ display:flex; flex-direction:row; align-items:center; gap:4px; margin:0 0 0 4px; padding-left:0; position:relative; }
  .nav-group:first-child{ margin-left:0; padding-left:0; }
  .nav-group::before{ display:none; }
  .nav-group:first-child::before{ display:none; }
  .nav-group-title{ display:none; }
  .nav-status{ display:none; }
  .st-done{ background:#dcfce7; color:#15803d; }
  .st-doing{ background:#fef3c7; color:#b45309; }
  .st-todo{ background:#e2e8f0; color:#475569; }
  .pg-status{ font-size:12px; font-weight:700; padding:3px 11px; border-radius:999px; margin-left:10px; letter-spacing:.3px; }

  /* ===== 右侧主体 ===== */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
  .topbar{ height:auto; flex-shrink:0; background:transparent; border-bottom:none; box-shadow:none;
    display:flex; align-items:center; justify-content:flex-end; padding:8px 22px 0; position:relative; z-index:5; }
  .topbar .tb-left{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .topbar .tb-crumb{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-4); }
  .topbar .tb-crumb .c1{ color:var(--ink-3); font-weight:500; }
  .topbar .tb-crumb .sep{ color:#cbd5e1; }
  .topbar .tb-crumb .c2{ color:var(--primary); font-weight:600; }
  .topbar .tb-row{ display:flex; align-items:center; gap:11px; margin-top:2px; }
  .topbar .pg-badge{ width:34px; height:34px; border-radius:10px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--primary),#6366f1); color:#fff; font-size:15px; font-weight:700;
    box-shadow:0 4px 12px rgba(59,91,219,.35); }
  .topbar h1{ font-size:19px; font-weight:700; color:var(--ink); letter-spacing:.2px; line-height:1.1; }
  .topbar .sub{ font-size:12px; color:var(--ink-3); margin-top:4px; }
  .topbar .upd{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--ink-2);
    background:var(--surface-2); border:1px solid var(--line); padding:8px 15px; border-radius:999px; }
  .topbar .upd .dot{ width:8px; height:8px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 4px rgba(34,197,94,.18); animation:pulse 2.4s infinite; }
  @keyframes pulse{ 0%,100%{ box-shadow:0 0 0 3px rgba(34,197,94,.20); } 50%{ box-shadow:0 0 0 7px rgba(34,197,94,.05); } }
  .scroll{ overflow-y:auto; padding:24px; flex:1; min-height:0; }
  .scroll::-webkit-scrollbar{ width:10px; }
  .scroll::-webkit-scrollbar-thumb{ background:#cdd5e2; border-radius:8px; border:2px solid transparent; background-clip:padding-box; }
  .scroll::-webkit-scrollbar-thumb:hover{ background:#b6c0d2; background-clip:padding-box; }
  .page{ display:none; animation:pageIn .3s ease; }
  .page.active{ display:block; }
  @keyframes pageIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
  .ph{ max-width:1240px; margin:0 auto; }

  /* 通用面板标题（左侧强调条） */
  .xian .panel-title, .exp .panel-title, .card-head{
    position:relative; padding-left:14px; font-weight:600;
  }
  .xian .panel-title::before, .exp .panel-title::before, .card-head::before{
    content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:4px; height:16px; border-radius:3px; background:linear-gradient(180deg,var(--primary),#818cf8); }
  /* 面板顶部细强调条 */
  .xian .panel, .exp .panel, .card{
    position:relative; overflow:hidden;
  }

  /* ================= 西安效率看板（作用域 .xian） ================= */
  .xian .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:22px 24px;
    box-shadow:var(--sh-sm); margin-bottom:18px; transition:box-shadow .2s, transform .2s; }
  .xian .panel:hover{ box-shadow:var(--sh-md); }
  .xian .panel-title{ font-size:15.5px; color:#16223a; margin:0 0 17px; }
  .xian .controls{ display:flex; flex-wrap:wrap; gap:16px 18px; align-items:flex-end; }
  .xian .field{ display:flex; flex-direction:column; gap:6px; }
  .xian .field label{ font-size:12px; color:var(--ink-3); font-weight:500; }
  .xian select, .xian input[type=number], .xian input[type=date]{
    height:42px; min-width:132px; padding:0 13px; border:1px solid #dbe2ec; border-radius:var(--r-sm);
    font-size:14px; color:#111827; background:#fff; outline:none; font-family:inherit; transition:.15s; }
  .xian input[type=date]{ min-width:152px; }
  .xian select:focus, .xian input:focus{ border-color:var(--primary); box-shadow:var(--shadow-focus); }
  .xian .btn-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .xian button{ border:0; border-radius:var(--r-sm); font-size:14px; cursor:pointer; font-weight:500;
    transition:all .16s; height:42px; padding:0 19px; font-family:inherit; }
  .xian button.primary{ background:linear-gradient(135deg,var(--primary),#5b6ef0); color:#fff; box-shadow:0 3px 10px rgba(59,91,219,.30); }
  .xian button.primary:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(59,91,219,.40); }
  .xian button.secondary{ background:var(--surface-3); color:#334155; border:1px solid #e2e8f0; }
  .xian button.secondary:hover{ background:#e6ecf5; color:#0f172a; }
  .xian button:active{ transform:scale(.97); }
  .xian button.flash{ animation:btnFlash .5s ease-out; }
  @keyframes btnFlash{ 0%{box-shadow:0 0 0 0 rgba(59,91,219,.55);} 100%{box-shadow:0 0 0 12px rgba(59,91,219,0);} }
  .xian .quick{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:15px; padding-top:15px; border-top:1px dashed #e6eaf0; }
  .xian .quick span{ font-size:12px; color:#9aa4b6; }
  .xian .quick button{ height:33px; padding:0 15px; border-radius:999px; background:#fff; border:1px solid #e2e8f0; color:#475569; font-size:13px; transition:.15s; }
  .xian .quick button:hover{ border-color:var(--primary); color:var(--primary); }
  .xian .quick button.active{ background:var(--primary-bg); border-color:var(--primary); color:var(--primary-700); font-weight:600; }
  .rep-sep{ height:0; border-top:1px dashed #e6eaf0; margin:20px 0; }
  .xian .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(236px,1fr)); gap:15px; }
  .xian .kpi{ background:linear-gradient(180deg,#ffffff,#fbfcff); border:1px solid var(--line); border-radius:var(--r-md);
    padding:16px 18px; position:relative; overflow:hidden; box-shadow:var(--sh-sm); }
  .xian .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--primary); opacity:.9; }
  .xian .kpi:nth-child(3n+2)::before{ background:var(--cyan); }
  .xian .kpi:nth-child(3n+3)::before{ background:var(--violet); }
  .xian .step-group{ display:flex; flex-direction:column; }
  .xian .step-subs{ margin-top:10px; padding-top:10px; border-top:1px dashed #e6eaf0; display:grid; grid-template-columns:1fr; gap:5px; }
  .xian .sub-item{ display:flex; align-items:baseline; gap:8px; font-size:12px; }
  .xian .sub-item .si-name{ color:#475569; min-width:118px; }
  .xian .sub-item .si-val{ color:var(--primary); font-weight:700; min-width:56px; text-align:right; }
  .xian .sub-item .si-detail{ color:#9ca3af; font-size:10px; }
  .xian .kpi .k{ font-size:12px; color:var(--ink-3); }
  .xian .kpi .v{ font-size:26px; font-weight:700; margin-top:7px; font-variant-numeric:tabular-nums; letter-spacing:-.5px; }
  .xian .v.red{ color:var(--red); } .xian .v.green{ color:var(--green); }
  .xian .v.sub{ color:var(--primary); }
  .xian .sub-kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:15px; }
  .xian .sub-kpis .kpi{ background:#fff; border:1px solid var(--line); border-radius:var(--r-md); padding:18px 16px; box-shadow:var(--sh-sm); }
  .xian .sub-eff-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(244px,1fr)); gap:16px; }
  .xian .se-card{ background:#fff; border:1px solid var(--line); border-radius:var(--r-lg); padding:20px 22px; box-shadow:var(--sh-sm); transition:box-shadow .2s; }
  .xian .se-card:hover{ box-shadow:var(--sh-md); }
  .xian .se-title{ font-size:15px; font-weight:700; color:#16223a; margin-bottom:12px; }
  .xian .se-cell{ display:flex; justify-content:space-between; align-items:baseline; padding:9px 0; border-top:1px dashed #eef2f7; }
  .xian .se-cell:first-of-type{ border-top:none; }
  .xian .se-ck{ font-size:13px; color:var(--ink-3); }
  .xian .se-cv{ font-size:18px; font-weight:700; color:var(--primary); font-variant-numeric:tabular-nums; }
  .xian .se-cv.pct{ color:var(--green); font-size:22px; }
  .xian .kpi .sn{ font-size:11px; color:#9aa4b6; margin-top:7px; line-height:1.5; }
  .xian .kpi .sn b{ color:#475569; font-weight:600; }
  .xian .note{ font-size:12px; color:#9aa4b6; margin-top:13px; line-height:1.7; }
  .xian .charts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(440px,1fr)); gap:18px; align-items:stretch; }
  .xian .charts > .chart-box{ min-width:0; }
  @media (max-width:1240px){ .xian .charts{ grid-template-columns:1fr; } }
  .xian .chart-box{ background:var(--surface-2); border:1px solid var(--line-2); border-radius:var(--r-md); padding:14px 16px; display:flex; flex-direction:column; overflow:hidden; }
  .xian .chart-box h3{ font-size:14px; margin:0 0 10px; color:#16223a; font-weight:600; flex:0 0 auto; }
  .xian canvas{ width:100% !important; display:block; max-width:100%; }
  .xian table{ width:100%; border-collapse:collapse; font-size:13px; }
  .xian th, .xian td{ padding:10px 11px; text-align:center; border-bottom:1px solid #eef2f7; }
  .xian th{ background:var(--surface-3); color:#475569; font-weight:600; position:sticky; top:0; }
  .xian tbody tr:nth-child(even){ background:#fafbfe; }
  .xian tbody tr:hover{ background:#eef3ff; }
  .xian .tag{ padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; display:inline-block; }
  .xian .tag.bad{ background:var(--red-bg); color:var(--red); }
  .xian .tag.good{ background:var(--green-bg); color:var(--green); }

  /* ================= 运营看板（统一升级） ================= */
  .toolbar{ background:#fff; border-radius:var(--r-md); padding:16px 22px; margin-bottom:18px;
    box-shadow:var(--sh-sm); border:1px solid var(--line);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .toolbar label{ font-size:14px; font-weight:600; color:#334155; }
  .card{ background:#fff; border-radius:var(--r-md); padding:20px 22px; box-shadow:var(--sh-sm); border:1px solid var(--line); }
  .card-head{ font-size:13.5px; font-weight:600; color:#334155; margin-bottom:14px; display:flex; align-items:center; gap:6px; }
  .ops-table{ width:100%; border-collapse:separate; border-spacing:0; font-size:13px; background:#fff; border-radius:var(--r-md);
    overflow:hidden; box-shadow:var(--sh-sm); border:1px solid var(--line); }
  .ops-table th{ background:var(--surface-3); color:#475569; font-weight:600; padding:12px 13px; text-align:center; border-bottom:1px solid #e2e6ee; position:sticky; top:0; }
  .ops-table th:first-child{ text-align:left; }
  .ops-table td{ padding:10px 13px; text-align:center; border-bottom:1px solid #f4f6f9; }
  .ops-table td:first-child{ text-align:left; color:#334155; }
  .ops-table tbody tr{ transition:background .12s; }
  .ops-table tbody tr:nth-child(even){ background:#fafbfe; }
  .ops-table tbody tr:hover{ background:#eef3ff; }
  .ops-table tr:last-child td{ border-bottom:none; }
  .ops-table .total-row{ background:var(--amber-bg); font-weight:700; }
  .ops-table .total-row td{ color:#1f2329; }
  .ctable-block{ margin-top:14px; }
  .ctable-title{ font-size:13.5px; font-weight:600; color:#1f2329; margin:12px 0 6px; }
  .ctable-desc{ font-size:11.5px; color:#86909c; line-height:1.65; margin-bottom:10px; }
  .ops-table td.grp{ text-align:left; color:#475569; line-height:1.55; word-break:break-all; }
  .ops-table td.cname{ text-align:left; font-weight:600; color:#1f2329; }
  .ops-table td.bar-cell{ text-align:left; padding:6px 13px; }
  .hbar{ display:flex; align-items:center; gap:8px; min-width:120px; }
  .hbar-fill{ height:14px; border-radius:7px; background:linear-gradient(90deg,#3b5bdb,#818cf8); min-width:2px; }
  .hbar-val{ font-size:12px; color:#1f2329; font-weight:600; white-space:nowrap; }
  .metric-checks{ display:flex; flex-wrap:wrap; gap:8px 18px; }
  .mc-item{ font-size:13px; color:#475569; display:flex; align-items:center; gap:5px; cursor:pointer; }
  .mc-item input{ accent-color:var(--primary); }
  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin-top:12px; font-size:12px; color:#475569; }
  .legend .lg{ display:flex; align-items:center; gap:5px; }
  .legend .lg i{ width:16px; height:4px; border-radius:2px; display:inline-block; }
  .footer{ text-align:center; font-size:12px; color:#aab2c0; margin-top:24px; padding-top:16px; border-top:1px solid #e8ebf0; }
  .line-tip{ position:fixed; background:rgba(15,23,42,.94); color:#fff; padding:9px 12px; border-radius:9px;
    font-size:12px; line-height:1.5; pointer-events:none; z-index:99; display:none; box-shadow:0 8px 22px rgba(15,23,42,.3); white-space:nowrap; }
  .line-tip .lt-name{ font-weight:700; margin-bottom:3px; }
  .line-tip .lt-row{ display:flex; justify-content:space-between; gap:14px; }
  .line-tip .lt-row b{ font-weight:700; }
  .delta-up{ color:#f53f3f; font-weight:700; } .delta-down{ color:#00b42a; font-weight:700; }
  .delta-zero{ color:#94a3b8; font-weight:700; } .delta-new{ color:#7c3aed; font-weight:700; }
  .analysis-list li::marker{ color:var(--primary); font-weight:700; }
  .date-trigger{ display:inline-flex; align-items:center; gap:7px; font-size:14px; font-weight:600; color:#1d2129;
    background:#fff; border:1px solid #d8dee8; border-radius:var(--r-sm); padding:9px 15px; cursor:pointer; transition:.15s; }
  .date-trigger:hover{ border-color:var(--primary); color:var(--primary); }
  .date-trigger .dt-label{ color:#86909c; font-weight:500; }
  .date-trigger .dt-value{ color:var(--primary); font-weight:700; }
  .date-trigger .dt-caret{ font-size:10px; color:#86909c; transition:transform .2s; }
  .date-trigger.open{ border-color:var(--primary); box-shadow:var(--shadow-focus); }
  .date-trigger.open .dt-caret{ transform:rotate(180deg); }
  .calendar{ display:block; width:fit-content; background:#fff; border:1px solid #e8ebf0; border-radius:var(--r-md);
    padding:12px 14px; box-shadow:var(--sh-lg); position:absolute; z-index:100; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:18px; }
  .cal-title{ font-size:14px; font-weight:700; color:#1d2129; }
  .cal-nav{ border:1px solid #d8dee8; background:#fff; color:#475569; width:26px; height:26px; border-radius:7px; cursor:pointer; font-size:12px; line-height:1; transition:.15s; }
  .cal-nav:hover{ border-color:var(--primary); color:var(--primary); }
  .cal-week, .cal-grid{ display:grid; grid-template-columns:repeat(7,34px); gap:4px; }
  .cal-week{ margin-bottom:4px; } .cal-week span{ text-align:center; font-size:11px; color:#aab2c0; }
  .cal-cell{ height:34px; display:flex; align-items:center; justify-content:center; border-radius:7px; font-size:13px; color:#cbd5e1; }
  .cal-cell.empty{ background:transparent; }
  .cal-cell.has{ background:var(--primary-bg); color:var(--primary); font-weight:600; cursor:pointer; }
  .cal-cell.has:hover{ background:var(--primary-bg-2); }
  .cal-cell.selected{ background:var(--primary); color:#fff; box-shadow:0 2px 8px rgba(59,91,219,.45); }
  .cal-legend{ display:flex; gap:14px; margin-top:10px; font-size:11px; color:#86909c; align-items:center; }
  .cal-legend i{ width:12px; height:12px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:-1px; }
  .dot-has{ background:var(--primary-bg); border:1px solid var(--primary); } .dot-sel{ background:var(--primary); }

  .single-report{ background:var(--surface-2); border-radius:var(--r-lg); padding:22px; }
  .single-report .header{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
    padding:24px 28px; margin-bottom:20px; box-shadow:var(--sh-sm); position:relative; overflow:hidden; }
  .single-report .header::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:4px 0 0 4px; background:linear-gradient(180deg,var(--primary),#818cf8); }
  .single-report .header::after{ display:none; }

  }
  function genOpsGrid(d){
    var proc=d.ops.processing, wo=d.ops.workOrder, dy=d.ops.douyinAudit;
    var total=Object.values(proc).reduce(function(a,b){return a+b;},0)+wo.total+dy;
    var items=[];
    Object.entries(proc).forEach(function(kv){ if(kv[0]==='pickupReturn') return; items.push([alias(kv[0]),kv[1],false]); });
    items.push([alias('工单处理量'),wo.total,false,'西安'+wo['西安']+' 太原'+wo['太原']+' 兰州'+wo['兰州']]);
    if(dy) items.push([alias('抖音每日仓内稽核'),dy,false]);
    // 取退货量已移除：取退货仅保留主看板「核心指标表」的群聊编码口径（=41），源表口径不再展示
    items.push(['当日处理总量',total,true]);
    return items.map(function(it){ var name=it[0],val=it[1],isTotal=it[2],sub=it[3]||''; var subHtml=sub?'<div class="cell-sub">'+sub+'</div>':''; var cls=isTotal?'ops-cell total':'ops-cell'; return '<div class="'+cls+'"><div class="cell-num">'+val+'</div><div class="cell-name">'+name+'</div>'+subHtml+'</div>'; }).join('');
  }
  function genWorkorderBars(d){
    var wo=d.ops.workOrder, total=wo.total;
    var cities=[['西安',wo['西安'],'#3370ff'],['太原',wo['太原'],'#00b42a'],['兰州',wo['兰州'],'#ff7d00']];
    return cities.map(function(c){ var name=c[0],val=c[1],color=c[2]; var p=pct(val,total); return '<div class="wo-line"><div class="wo-info"><span class="wo-city">'+name+'</span><span class="wo-pct">'+val+'单（'+p+'%）</span></div><div class="wo-track"><div class="wo-fill" style="width:'+p+'%;background:'+color+';"></div></div></div>'; }).join('');
  }
  function genBarChart(d){
    var proc=d.ops.processing, wo=d.ops.workOrder, dy=d.ops.douyinAudit;
    var items=[];
    Object.entries(proc).forEach(function(kv){ if(kv[0]==='pickupReturn') return; items.push([alias(kv[0]),kv[1]]); });
    items.push([alias('工单处理量'),wo.total]);
    if(dy) items.push([alias('抖音每日仓内稽核'),dy]);
    // 取退货量已移除：取退货仅保留主看板「核心指标表」的群聊编码口径（=41），源表口径不再展示
    var mx=Math.max.apply(null,items.map(function(x){return x[1];}))||1;
    return items.map(function(it){ var name=it[0],val=it[1]; var color=val===mx?'#ff7d00':'#3370ff'; var h=Math.max(Math.round(val/mx*140),4); return '<div class="chart-col"><div class="chart-val">'+val+'</div><div class="chart-bar" style="height:'+h+'px;background:'+color+';"></div><div class="chart-lbl">'+name+'</div></div>'; }).join('');
  }
  function qcTable(rows){ if(!rows||!rows.length) return ''; return '<table class="audit-table"><thead><tr><th>日期</th><th>班组</th><th>稽核点</th><th>负责人</th><th>问题描述</th></tr></thead><tbody>'+rows.map(function(r){ return '<tr><td>'+(r.date||'')+'</td><td>'+(r.team||'')+'</td><td>'+(r.point||'')+'</td><td>'+(r.owner||'')+'</td><td>'+(r.issue||'')+'</td></tr>'; }).join('')+'</tbody></table>'; }
  function genQualityCheckSection(d){
    var qc=d.qualityCheck||{}, newCount=qc.newCount||0, total=qc.totalChecks||0, md=d.date.slice(5).replace('-','/');
    var plan='';
    if(qc.improvementPlan&&qc.improvementPlan.length){ plan='<div class="plan-title">'+(newCount>0?'针对当日检出问题的改善方向':'素养检查改善方向')+'</div><ol class="plan-list">'+qc.improvementPlan.map(function(it){return '<li>'+it+'</li>';}).join('')+'</ol>'; }
    if(newCount>0){ var alert='<div class="audit-alert"><span class="alert-icon">!</span>'+md+' 当日素养检查 '+total+' 次，检出问题 <strong>'+newCount+' 条</strong>（含问题描述），须当班次整改闭环。</div>'; var rows=(qc.records&&qc.records.length)?qc.records:(qc.lastRecord?[qc.lastRecord]:[]); return alert+(qcTable(rows)||'<div class="audit-note">'+(qc.improvement||'')+'</div>')+plan; }
    var lrDate=qc.lastRecord?qc.lastRecord.date:'-';
    var alert='<div class="audit-alert" style="background:#e8ffea;color:#00b42a;">'+(total>0?(md+' 当日素养检查 '+total+' 次，未检出问题。'):(md+' 当日无素养检查记录。'))+(qc.lastRecord?'以下取最近一次检出记录（'+lrDate+'）进行分析。':'')+'</div>';
    var table=qc.lastRecord?qcTable([qc.lastRecord]):'<div class="audit-note">'+(qc.improvement||'当日未检出素养问题。')+'</div>';
    return alert+table+plan;
  }
  function genWarningSection(d){
    var w=d.warning||{}, total=w.total||0, records=w.records||[], src=w.source||'';
    var html='<div class="warn-summary">当日西安未处理预警 <strong>'+total+'</strong> 条'+(src?' <span class="warn-src">（来源：'+src+'）</span>':'')+'</div>';
    if(total>0){ var byType=w.byType||{}; var chips=Object.keys(byType).map(function(t){return '<span class="warn-chip">'+t+' '+byType[t]+'</span>';}).join(''); html+='<div class="warn-chips">'+chips+'</div>'; html+='<table class="warn-table"><thead><tr><th>物品编号</th><th>预警类型</th><th>超时区间</th><th>原因反馈</th></tr></thead><tbody>'; records.forEach(function(r){ html+='<tr><td>'+(r.itemId||'')+'</td><td>'+(r.type||'')+'</td><td>'+(r.timeout||'')+'</td><td>'+(r.reason||'')+'</td></tr>'; }); html+='</tbody></table>'; }
    else { html+='<div class="audit-note">当日西安无未处理预警'+(src?'（'+src+' 亦无）':'')+'。</div>'; }
    return html;
  }
  function odsReportHtml(date){
    var cur=D[date];
    if(!cur || !_hasReal(date)){ return '<div class="card">'+date+' 暂无运营数据（当日数据尚未生成）</div>'; }
    var day=+date.split('-')[2], month=+date.split('-')[1];
    var now=new Date();
    var genTime=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
    var wo=cur.ops.workOrder;
    return '<div class="single-report">'+
      '<div class="header"><h1>运营数据汇总日报</h1><div class="sub">统计日期：'+date+' ｜ 数据范围：客服对接 · 内部消息 · 运营处理量 · 素养检查 · 预警看板</div></div>'+
      '<div class="section"><div class="section-title">板块一 · 消息对接统计</div>'+genMessageCards(cur)+'</div>'+
      '<div class="section"><div class="section-title">板块二 · '+month+'月'+day+'日 运营处理量</div><div class="panel"><div class="ops-grid">'+genOpsGrid(cur)+'</div></div>'+
      '<div class="panel wo-section"><div class="wo-header">工单处理量明细 · 各区域日工单 ｜ 西安'+wo['西安']+' 太原'+wo['太原']+' 兰州'+wo['兰州']+' ｜ 当日合计 <strong>'+wo.total+'</strong> 单</div>'+genWorkorderBars(cur)+'</div>'+
      '<div class="panel chart-section"><div class="chart-title">运营处理量分布 · 各指标对比</div><div class="chart-wrap">'+genBarChart(cur)+'</div></div></div>'+
      '<div class="section"><div class="section-title">板块三 · 素养检查</div><div class="panel">'+genQualityCheckSection(cur)+'</div></div>'+
      '<div class="section"><div class="section-title">板块四 · 预警看板</div><div class="panel">'+genWarningSection(cur)+'</div></div>'+
      '<div class="footer">报告生成时间：'+genTime+' ｜ 数据来源：飞书群消息 + 飞书表格「抖音交付、稽核汇总」+ 飞书多维表「预警未处理明细 / 素养检查」</div></div>';
  }
  function odsRender(date){ $('odsContent').innerHTML=odsReportHtml(date); }
  function odsRenderRange(from,to){
    var list=dates.filter(function(d){ return d>=from && d<=to && _hasReal(d); });
    if(!list.length){ $('odsContent').innerHTML='<div class="card">所选区间（'+from+' ~ '+to+'）暂无运营数据</div>'; return; }
    $('odsContent').innerHTML=list.map(odsReportHtml).join('<div class="rep-sep"></div>');
  }
  function odsSetQuick(key){ document.querySelectorAll('#page-ops-day .quick button').forEach(function(b){ b.classList.toggle('active', b.dataset.range===key); }); }
  function odsMatchQuick(){ var s=$('odStart').value, e=$('odEnd').value, min=dates[0], max=dates[dates.length-1]; if(s===min&&e===max) return 'all'; var n7=Math.max(0,dates.length-7), n3=Math.max(0,dates.length-3); if(s===dates[n7]&&e===max) return '7'; if(s===dates[n3]&&e===max) return '3'; return ''; }
  function initOpsDay(){
    // 顶部元信息：数据覆盖区间 / 天数 / 最近同步日（证明数据每日动态更新，非静态）
    try{
      if($('odsMetaRange')) $('odsMetaRange').textContent = (dates[0]||'—') + ' ~ ' + (dates[dates.length-1]||'—');
      if($('odsMetaDays')) $('odsMetaDays').textContent = dates.length;
      if($('odsMetaSync')) $('odsMetaSync').textContent = dates[dates.length-1] || '—';
    }catch(e){}
    var s=$('odStart'), e=$('odEnd'), min=dates[0], max=dates[dates.length-1];
    s.min=e.min=min; s.max=e.max=max;
    s.value=max; e.value=max; // 默认显示最新一天（单日详情语义）
    if($('odDay')) $('odDay').value=max;
    odsSetQuick(''); // 默认单日，不高亮任何区间
    odsRender(max);
    $('odApply').onclick=function(){
      if(s.value>max) s.value=max; if(e.value>max) e.value=max;
      if(s.value<min) s.value=min; if(e.value<min) e.value=min;
      if(s.value>e.value){ var t=s.value; s.value=e.value; e.value=t; }
      if($('odDay')) $('odDay').value=e.value;
      odsSetQuick(odsMatchQuick());
      odsRenderRange(s.value,e.value);
    };
    $('odReset').onclick=function(){ s.value=min; e.value=max; if($('odDay')) $('odDay').value=max; odsSetQuick('all'); odsRenderRange(min,max); };
    document.querySelectorAll('#page-ops-day .quick button').forEach(function(btn){
      btn.onclick=function(){ odsSetQuick(btn.dataset.range); if(btn.dataset.range==='all'){ s.value=min; e.value=max; } else { var n=parseInt(btn.dataset.range,10), idx=Math.max(0,dates.length-n); s.value=dates[idx]; e.value=max; } if($('odDay')) $('odDay').value=e.value; odsRenderRange(s.value,e.value); };
    });
    var d=$('odDay'); if(d){ d.min=min; d.max=max; d.value=max;
      d.onchange=function(){ var day=d.value; if(day<s.value) s.value=day; if(day>e.value) e.value=day; odsSetQuick(odsMatchQuick()); odsRender(day); };
    }
    $('odDayToday').onclick=function(){ if($('odDay')) $('odDay').value=max; s.value=max; e.value=max; odsSetQuick(''); odsRender(max); };
    $('odDayYesterday').onclick=function(){ var idx=dates.indexOf(max); var y=dates[Math.max(0,idx-1)]; if($('odDay')) $('odDay').value=y; s.value=y; e.value=max; odsSetQuick(''); odsRender(y); };
  }
initOpsDay();
})();
</script>
</body>
</html>
